[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalduino-mqtt"
version = "0.1.0"
description = "SignalDuino Protocols in Python with MQTT bridge"
authors = [{name="Sven"}]
dependencies = [
    "requests",
    "pyserial-asyncio",
    "aiomqtt",
    "python-dotenv",
    "jsonschema"
]

[project.optional-dependencies]
homeassistant = [
    "aiomqtt==2.5.1",
    "paho-mqtt==2.2.0",
    "prometheus-client==0.26.0"
]

[tool.setuptools.packages.find]
include = ["signalduino*", "sd_protocols*"]

[tool.setuptools.package-data]
sd_protocols = ["protocols.json"]
"signalduino.decoders" = ["spec_schema.json", "specs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.pytest-asyncio]
mode = "auto"
